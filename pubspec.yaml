name: braille_translator
description: A project to translate image text to Braille.

publish_to: 'none' 

version: 1.0.0+1

environment:
  sdk: ">=2.15.0 <3.0.0"

dependencies:
  flutter:
    sdk: flutter


  cupertino_icons: ^1.0.2
  image_picker: ^0.8.5+3
  http: ^0.13.5
  flutter_dotenv: ^5.0.2
  either_dart: ^0.3.0
  image_cropper: ^1.5.1
  flutter_launcher_icons: ^0.11.0
  localization: ^2.1.0
  flutter_localizations: 
    sdk: flutter
    version: ^0.0.0
  path_provider: ^2.0.11
  open_file: ^3.2.1
  pdf: ^3.8.4
  printing: ^5.9.3
  flutter_native_splash: ^2.2.16

dev_dependencies:
  flutter_test:
    sdk: flutter
    
flutter_native_splash:
  color: "#ffffff"
  image: assets/images/splash-icon.png
  web: false

flutter_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/images/braille-icon.png"
  min_sdk_android: 21
  remove_alpha_ios: true
  web:
    generate: true
    image_path: "assets/images/braille-icon.png"
    background_color: "#hexcode"
    theme_color: "#hexcode"
  windows:
    generate: true
    image_path: "assets/images/braille-icon.png"
    icon_size: 48 
  macos:
    generate: true
    image_path: "assets/images/braille-icon.png"

  
  flutter_lints: ^1.0.0

flutter:

  uses-material-design: true

  assets:
    - .env
    - assets/

  # fonts:
  #   - family: Schyler
  #     fonts:
  #       - asset: fonts/Schyler-Regular.ttf
  #       - asset: fonts/Schyler-Italic.ttf
