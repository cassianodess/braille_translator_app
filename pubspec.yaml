name: braille_translator
description: A project to translate image text to Braille.

publish_to: 'none' 

version: 1.0.0+1

environment:
  sdk: ">=2.15.0 <3.0.0"

dependencies:
  flutter:
    sdk: flutter


  cupertino_icons: ^1.0.2
  image_picker: ^0.8.5+3
  http: ^0.13.5
  flutter_dotenv: ^5.0.2
  either_dart: ^0.3.0
  image_cropper: ^1.5.1
  flutter_launcher_icons: ^0.11.0

dev_dependencies:
  flutter_test:
    sdk: flutter

flutter_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/images/braille.png"
  min_sdk_android: 21
  remove_alpha_ios: true
  web:
    generate: true
    image_path: "assets/images/braille.png"
    background_color: "#hexcode"
    theme_color: "#hexcode"
  windows:
    generate: true
    image_path: "assets/images/braille.png"
    icon_size: 48 
  macos:
    generate: true
    image_path: "assets/images/braille.png"

  
  flutter_lints: ^1.0.0

flutter:

  uses-material-design: true

  assets:
    - .env
    - assets/

  # fonts:
  #   - family: Schyler
